<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa AI</title>
<style>
  :root{
    --ink:#1a1523;
    --paper:#faf7ff;
    --violet:#6c4bff;
    --violet-deep:#4b2fd6;
    --coral:#ff6b6b;
    --amber:#ffb84c;
    --teal:#2fd6c0;
    --bubble-user:#6c4bff;
    --bubble-ai:#ffffff;
    --border:#e8e2fb;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(108,75,255,0.18), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,107,107,0.16), transparent 40%),
      var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  header{
    padding:18px 22px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--border);
    background:rgba(250,247,255,0.85);
    backdrop-filter:blur(6px);
    position:relative;
    z-index:2;
  }
  .logo{
    width:38px;height:38px;border-radius:12px;
    background:linear-gradient(135deg, var(--violet), var(--coral));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:white;font-size:16px;
    flex-shrink:0;
    box-shadow:0 4px 14px rgba(108,75,255,0.35);
  }
  header h1{
    font-size:17px;
    margin:0;
    font-weight:700;
    letter-spacing:-0.2px;
  }
  header p{
    margin:0;
    font-size:12px;
    color:#7a7288;
  }
  #chat{
    flex:1;
    overflow-y:auto;
    padding:24px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{
    max-width:78%;
    padding:12px 16px;
    border-radius:18px;
    line-height:1.5;
    font-size:14.5px;
    white-space:pre-wrap;
    word-wrap:break-word;
    animation:pop .25s ease;
  }
  @keyframes pop{
    from{opacity:0; transform:translateY(6px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .msg.user{
    align-self:flex-end;
    background:linear-gradient(135deg, var(--violet), var(--violet-deep));
    color:white;
    border-bottom-right-radius:6px;
  }
  .msg.ai{
    align-self:flex-start;
    background:var(--bubble-ai);
    border:1px solid var(--border);
    border-bottom-left-radius:6px;
    box-shadow:0 2px 10px rgba(108,75,255,0.06);
  }
  .msg.ai.error{
    border-color:var(--coral);
    color:#a3202a;
    background:#fff0f0;
  }
  .typing{
    align-self:flex-start;
    display:flex;
    gap:5px;
    padding:14px 18px;
    background:var(--bubble-ai);
    border:1px solid var(--border);
    border-radius:18px;
    border-bottom-left-radius:6px;
  }
  .typing span{
    width:7px;height:7px;border-radius:50%;
    background:var(--violet);
    opacity:.4;
    animation:bounce 1.1s infinite;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0); opacity:.4;}
    30%{transform:translateY(-5px); opacity:1;}
  }
  .empty{
    margin:auto;
    text-align:center;
    color:#9089a3;
    max-width:320px;
  }
  .empty .logo{margin:0 auto 14px;}
  .empty h2{font-size:16px;color:var(--ink);margin:0 0 6px;}
  .empty p{font-size:13px;line-height:1.5;}
  form{
    display:flex;
    gap:10px;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
    background:rgba(250,247,255,0.9);
    backdrop-filter:blur(6px);
  }
  textarea{
    flex:1;
    resize:none;
    border:1.5px solid var(--border);
    border-radius:16px;
    padding:12px 14px;
    font-size:14.5px;
    font-family:inherit;
    max-height:120px;
    outline:none;
    transition:border-color .15s;
    background:white;
  }
  textarea:focus{border-color:var(--violet);}
  button{
    border:none;
    width:46px;height:46px;
    border-radius:14px;
    background:linear-gradient(135deg, var(--violet), var(--coral));
    color:white;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s, box-shadow .12s;
    box-shadow:0 4px 14px rgba(108,75,255,0.3);
  }
  button:active{transform:scale(.92);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  ::-webkit-scrollbar{width:6px;}
