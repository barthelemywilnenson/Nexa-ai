
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa AI</title>
<style>
  :root{
    --ink:#1a1523;
    --paper:#faf7ff;
    --violet:#6c4bff;
    --violet-deep:#4b2fd6;
    --coral:#ff6b6b;
    --border:#e8e2fb;
    --bubble-ai:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(108,75,255,0.18), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,107,107,0.16), transparent 40%),
      var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  header{
    padding:18px 22px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--border);
    background:rgba(250,247,255,0.85);
  }
  .logo{
    width:38px;height:38px;border-radius:12px;
    background:linear-gradient(135deg, var(--violet), var(--coral));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:white;font-size:16px;
    flex-shrink:0;
  }
  header h1{font-size:17px;margin:0;font-weight:700;}
  header p{margin:0;font-size:12px;color:#7a7288;}
  #chat{
    flex:1;
    overflow-y:auto;
    padding:24px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{
    max-width:78%;
    padding:12px 16px;
    border-radius:18px;
    line-height:1.5;
    font-size:14.5px;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg.user{
    align-self:flex-end;
    background:linear-gradient(135deg, var(--violet), var(--violet-deep));
    color:white;
    border-bottom-right-radius:6px;
  }
  .msg.ai{
    align-self:flex-start;
    background:var(--bubble-ai);
    border:1px solid var(--border);
    border-bottom-left-radius:6px;
  }
  .msg.ai.error{border-color:var(--coral);color:#a3202a;background:#fff0f0;}
  .typing{
    align-self:flex-start;
    display:flex;
    gap:5px;
    padding:14px 18px;
    background:var(--bubble-ai);
    border:1px solid var(--border);
    border-radius:18px;
    border-bottom-left-radius:6px;
  }
  .typing span{
    width:7px;height:7px;border-radius:50%;
    background:var(--violet);
    opacity:.4;
    animation:bounce 1.1s infinite;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0); opacity:.4;}
    30%{transform:translateY(-5px); opacity:1;}
  }
  .empty{margin:auto;text-align:center;color:#9089a3;max-width:320px;}
  .empty .logo{margin:0 auto 14px;}
  .empty h2{font-size:16px;color:var(--ink);margin:0 0 6px;}
  .empty p{font-size:13px;line-height:1.5;}
  form{
    display:flex;
    gap:10px;
    padding:14px 16px;
    border-top:1px solid var(--border);
    background:rgba(250,247,255,0.9);
  }
  textarea{
    flex:1;
    resize:none;
    border:1.5px solid var(--border);
    border-radius:16px;
    padding:12px 14px;
    font-size:14.5px;
    font-family:inherit;
    max-height:120px;
    outline:none;
    background:white;
  }
  textarea:focus{border-color:var(--violet);}
  button{
    border:none;
    width:46px;height:46px;
    border-radius:14px;
    background:linear-gradient(135deg, var(--violet), var(--coral));
    color:white;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  button:disabled{opacity:.5;}
</style>
</head>
<body>
<header>
  <div class="logo">N</div>
  <div>
    <h1>Nexa AI</h1>
    <p>Votre assistant intelligent</p>
  </div>
</header>
<div id="chat">
  <div class="empty" id="emptyState">
    <div class="logo">N</div>
    <h2>Comment puis-je vous aider aujourd'hui ?</h2>
    <p>Écrivez une question ci-dessous pour démarrer une conversation.</p>
  </div>
</div>
<form id="form">
  <textarea id="input" placeholder="Écrivez votre message..." rows="1"></textarea>
  <button type="submit" id="sendBtn">➤</button>
</form>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');
const BACKEND_URL = "https://nexa-ai-mrbc.onrender.com/api/chat";
let history = [];

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
function addMessage(role, text, isError=false) {
  if (emptyState) emptyState.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai') + (isError ? ' error' : '');
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMessage('user', text);
  history.push({ role: 'user', content: text });
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  showTyping();
  try {
    const response = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    const data = await response.json();
    hideTyping();
    if (!response.ok) {
      addMessage('ai', data.error || "Une erreur s'est produite.", true);
      return;
    }
    addMessage('ai', data.reply);
    history.push({ role: 'assistant', content: data.reply });
  } catch (err) {
    hideTyping();
    addMessage('ai', "Erreur de connexion au serveur. Veuillez réessayer.", true);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
